[project]
name = "smart-home-voice-service"
version = "0.1.0"
description = "CPU-only local voice validation service for the smart-home Agent"
requires-python = ">=3.11,<3.12"
dependencies = [
  "click==8.5.0",
  "edge-tts==7.2.8",
  "numpy==2.4.6",
  "pypinyin==0.55.0",
  "sentencepiece==0.2.2",
  "sherpa-onnx==1.13.8",
  "sounddevice==0.5.6",
  "soundfile==0.14.0",
]

[project.optional-dependencies]
dev = [
  "psutil==7.2.2",
  "pytest==9.1.1",
]
# Speaker identification needs no extra install: the models are sherpa-onnx
# speaker-embedding ONNX files and sherpa-onnx is already a runtime dependency.
# Only the model file itself has to be downloaded (see README).

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
