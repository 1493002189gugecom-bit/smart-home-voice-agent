<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0;background:#10172a;color:#eaf1f4"><div style="position:absolute;z-index:2;padding:16px">模拟确认快照 · 家具与设备效果验证</div><div id="stage" style="height:100vh;width:100vw"></div><script type="module">
import {createHomeScene} from '/src/home-scene.ts';
window.scene=createHomeScene(document.querySelector('#stage'),()=>{});
