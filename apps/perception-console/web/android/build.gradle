// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Capacitor sync regenerates flatDir repositories even when no local archives exist.
// Remove only empty repositories; keep any used by a plugin's local JAR/AAR files.
subprojects {
    afterEvaluate { module ->
        module.repositories.removeAll { repository ->
            repository instanceof org.gradle.api.artifacts.repositories.FlatDirectoryArtifactRepository &&
                repository.dirs.every { directory ->
                    module.fileTree(dir: directory, includes: ['**/*.jar', '**/*.aar']).files.empty
                }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
